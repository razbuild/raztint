<svg width="1058" height="1058" viewBox="0 0 1058 1058" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

    <!-- Premium blue -->
    <linearGradient id="blue" x1="300" y1="250" x2="760" y2="760">
        <stop offset="0%" stop-color="#8DD1FF"/>
        <stop offset="45%" stop-color="#5DA9E9"/>
        <stop offset="100%" stop-color="#2876C7"/>
    </linearGradient>


    <!-- Subtle texture -->
    <pattern id="noise" width="90" height="90" patternUnits="userSpaceOnUse">
        <circle cx="15" cy="15" r="1" fill="#FFFFFF" opacity=".025"/>
    </pattern>


    <clipPath id="clip">
        <rect x="17" y="17" width="1024" height="1024" rx="225"/>
    </clipPath>

</defs>


<!-- Background -->
<rect
    x="17"
    y="17"
    width="1024"
    height="1024"
    rx="225"
    fill="#050505"/>


<!-- Subtle grain -->
<rect
    x="17"
    y="17"
    width="1024"
    height="1024"
    rx="225"
    fill="url(#noise)"
    clip-path="url(#clip)"/>


<!-- Outer -->
<path
    d="M790 790V268H268"
    fill="none"
    stroke="url(#blue)"
    stroke-width="82"
    stroke-linecap="round"
    stroke-linejoin="round"/>


<!-- Inner -->
<path
    d="M650 660V408H408"
    fill="none"
    stroke="url(#blue)"
    stroke-width="56"
    stroke-linecap="round"
    stroke-linejoin="round"/>


</svg>